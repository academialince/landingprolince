<!doctype html>
<html lang="es-ES">
<head>
<meta charset="utf-8">
<title>Artículos que más caen · vídeo</title>
<!--
  Plantilla de vídeo vertical (1080×1920, Reels/TikTok/Shorts) de la serie
  «Los artículos que más caen», con el sistema visual de prolinceacademia.com
  (src/app/globals.css): Manrope, fondo blanco con halo verde y trama de puntos,
  verde #03512D, verde suave #E3F4E8, verde profundo #002A15 e iconos Lucide.

  Para otro artículo del Top 30 basta con cambiar el objeto DATA.
  Abierto en el navegador se reproduce solo; render.mjs lo pasa a MP4 fotograma a fotograma
  llamando a window.render(t), así que toda la animación depende únicamente de t.
-->
<style>
  /* Manrope variable, subconjunto latino (el mismo archivo que sirve la web vía @fontsource) */
  @font-face { font-family: "Manrope"; font-weight: 200 800; font-display: block; src: url(fuentes/manrope-variable.woff2) format("woff2"); }

  /* Tokens de globals.css convertidos de oklch a hex */
  :root {
    --fg: #121b16;
    --primary: #03512d;
    --primary-soft: #e3f4e8;
    --primary-soft-fg: #004624;
    --primary-deep: #002a15;
    --muted: #f2f7f5;
    --muted-fg: #535e57;
    --border: #dde4e0;
    --border-strong: #c3cdc8;
    --warning: #a46e00;
    --warning-soft: #fbf1dc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #111; }
  body { display: grid; place-items: center; min-height: 100vh; overflow: hidden; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: #fff; color: var(--fg);
    font-family: Manrope, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  body.render { display: block; background: #fff; }
  body.render #stage { transform: none !important; }

  /* Fondo del hero de la web: halo verde arriba a la derecha y trama de puntos que se desvanece */
  #halo { inset: 0; background: radial-gradient(120% 55% at 85% -8%, var(--primary-soft) 0%, transparent 60%); }
  #puntos { inset: 0; opacity: .55;
    background-image: radial-gradient(color-mix(in oklch, var(--primary) 16%, transparent) 2px, transparent 2px);
    background-size: 52px 52px;
    -webkit-mask-image: radial-gradient(80% 42% at 50% 0%, black, transparent);
            mask-image: radial-gradient(80% 42% at 50% 0%, black, transparent); }

  .abs { position: absolute; }
  .eyebrow { font-size: 26px; line-height: 1.2; letter-spacing: .08em; font-weight: 600; text-transform: uppercase; color: var(--primary); }
  .display { font-weight: 780; letter-spacing: -0.038em; line-height: 1.06; color: var(--fg); }
  .subrayado { position: relative; white-space: nowrap; z-index: 0; }
  .subrayado i { position: absolute; left: 0; right: 0; bottom: .08em; height: .32em; background: var(--primary-soft); z-index: -1;
                 transform-origin: 0 50%; }
  .tile { flex: none; display: grid; place-items: center; width: 84px; height: 84px; border-radius: 22px; background: var(--primary-soft); color: var(--primary); }
  .tile svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Cabecera */
  #logo { left: 96px; top: 236px; width: 300px; }
  #pill, #s0-pill { right: 96px; top: 244px; height: 64px; padding: 0 28px; border-radius: 14px; background: var(--primary); color: #f9fdfa;
          font-weight: 700; font-size: 26px; letter-spacing: .02em; display: flex; align-items: center;
          box-shadow: 0 8px 22px color-mix(in oklch, var(--primary) 18%, transparent); }

  /* 1 · Gancho */
  #s1-eyebrow { left: 96px; top: 420px; }
  #s1-q { left: 96px; top: 478px; width: 900px; font-size: 128px; }
  #s1-q > span { display: block; }
  #s1-sub { left: 96px; top: 1170px; width: 820px; font-size: 38px; line-height: 1.5; color: var(--muted-fg); }

  /* 2 · Revelación */
  #s2-eyebrow { left: 96px; top: 420px; }
  #s2-art { left: 90px; top: 470px; font-size: 176px; letter-spacing: -0.045em; line-height: 1; white-space: nowrap; transform-origin: 0 60%; }
  #s2-ley { left: 96px; top: 672px; font-size: 36px; font-weight: 600; color: var(--muted-fg); }
  #s2-chip { left: 96px; top: 736px; }
  #s2-chip, #s0-chip { display: flex; align-items: center; gap: 12px; padding: 14px 26px; border-radius: 999px;
             background: var(--primary-soft); color: var(--primary-soft-fg); font-size: 30px; font-weight: 700; transform-origin: 0 50%; }
  #s2-chip b, #s0-chip b { width: 12px; height: 12px; border-radius: 50%; background: var(--primary); }

  /* 3 · Contador (banda de KPI de la web) */
  #s3-card { left: 96px; top: 880px; width: 888px; background: var(--primary-deep); border-radius: 28px; padding: 44px 48px 46px; color: #fff; }
  #s3-card .fila { display: flex; align-items: baseline; gap: 22px; }
  #s3-num { font-size: 190px; font-weight: 780; letter-spacing: -0.04em; line-height: .9; min-width: 205px; }
  #s3-card .veces { font-size: 44px; font-weight: 680; color: var(--primary-soft); letter-spacing: -0.015em; }
  #s3-card .det { font-size: 30px; color: rgb(255 255 255 / .65); margin-top: 4px; }
  #s3-dots { display: flex; gap: 12px; margin-top: 34px; }
  #s3-dots i { width: 56px; height: 14px; border-radius: 7px; background: #d8f5df; display: block; transform-origin: 0 50%; }
  #s3-years { margin-top: 22px; font-size: 27px; font-weight: 600; color: rgb(255 255 255 / .65); white-space: nowrap; }

  /* 4 · Qué dice */
  #s4-eyebrow { left: 96px; top: 880px; }
  .fact { left: 96px; width: 888px; display: flex; gap: 30px; align-items: flex-start; }
  .fact .k { font-size: calc(34px * var(--k, 1)); font-weight: 700; letter-spacing: -0.015em; color: var(--fg); line-height: 1.25; margin-top: 2px; }
  .fact .v { font-size: calc(31px * var(--k, 1)); line-height: 1.45; color: var(--muted-fg); margin-top: 4px; }
  .fact .v b { color: var(--primary); font-weight: 700; }

  /* 5 · Tribunal y trampa */
  #s5-card { left: 96px; top: 880px; width: 888px; background: var(--primary-deep); border-radius: 28px; padding: 44px 48px 48px; color: #fff; }
  #s5-card .eyebrow { color: #a9e9bc; }
  #s5-card .v { font-size: 46px; font-weight: 700; line-height: 1.25; letter-spacing: -0.02em; margin-top: 18px; }
  #s5-trap { left: 96px; top: 1245px; width: 888px; background: #fff; border: 2px solid var(--border); border-radius: 28px; padding: 36px 40px;
             display: flex; gap: 28px; box-shadow: 0 30px 60px -30px color-mix(in oklch, var(--primary) 45%, transparent); }
  #s5-trap .tile { background: var(--warning-soft); color: var(--warning); }
  #s5-trap .eyebrow { color: var(--warning); font-size: 24px; }
  #s5-trap .v { font-size: 33px; line-height: 1.4; margin-top: 10px; color: var(--fg); }
  #s5-trap .v b { color: var(--primary); font-weight: 700; }

  /* Pie */
  #foot { left: 96px; right: 96px; top: 1590px; display: flex; justify-content: space-between; font-size: 25px; font-weight: 600; color: var(--muted-fg); }
  #bar { left: 96px; right: 96px; top: 1640px; height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--primary); border-radius: 4px; }

  /* 6 · Cierre (sección CTA de la web) */
  #s6 { left: 0; top: 0; width: 1080px; height: 1920px; background: var(--primary-deep); color: #fff; }
  #s6-puntos { inset: 0; opacity: .5;
    background-image: radial-gradient(rgb(255 255 255 / .09) 2px, transparent 2px); background-size: 52px 52px;
    -webkit-mask-image: radial-gradient(70% 45% at 50% 40%, black, transparent); mask-image: radial-gradient(70% 45% at 50% 40%, black, transparent); }
  #s6-iso { left: 50%; top: 470px; width: 230px; margin-left: -115px; }
  #s6-t { left: 96px; width: 888px; top: 800px; text-align: center; font-size: 80px; font-weight: 780; letter-spacing: -0.038em; line-height: 1.06; }
  #s6-p { left: 126px; width: 828px; top: 950px; text-align: center; font-size: 38px; line-height: 1.5; color: rgb(255 255 255 / .75); }
  #s6-btn { left: 50%; top: 1110px; transform-origin: 50% 50%; }
  #s6-btn span { display: inline-flex; align-items: center; gap: 16px; height: 96px; padding: 0 44px; border-radius: 18px; background: #fff; color: var(--primary-deep);
                 font-size: 38px; font-weight: 700; white-space: nowrap; transform: translateX(-50%); }
  #s6-btn svg { width: 36px; height: 36px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  #s6-handle { left: 0; width: 1080px; top: 1270px; text-align: center; font-size: 32px; font-weight: 700; color: #a9e9bc; }
  /* 0 · Portada: primer fotograma = miniatura del vídeo (y portada-XX.png) */
  #s0 { left: 0; top: 0; width: 1080px; height: 1920px; background: #fff; }
  #s0 .halo { inset: 0; background: radial-gradient(120% 55% at 85% -8%, var(--primary-soft) 0%, transparent 60%); }
  #s0 .puntos { inset: 0; opacity: .55; background-image: radial-gradient(color-mix(in oklch, var(--primary) 16%, transparent) 2px, transparent 2px);
    background-size: 52px 52px; -webkit-mask-image: radial-gradient(80% 42% at 50% 0%, black, transparent); mask-image: radial-gradient(80% 42% at 50% 0%, black, transparent); }
  #s0-logo { left: 96px; top: 236px; width: 300px; }
  #s0-pill { right: 96px; top: 244px; }
  #s0-col { left: 96px; top: 470px; width: 888px; display: flex; flex-direction: column; align-items: flex-start; }
  #s0-art { margin: 18px 0 0 -6px; font-size: 240px; letter-spacing: -0.045em; line-height: 1; white-space: nowrap; }
  #s0-ley { margin-top: 26px; font-size: 38px; font-weight: 600; color: var(--muted-fg); }
  #s0-chip { position: static; margin-top: 22px; }
  #s0-card { margin-top: 64px; width: 888px; background: var(--primary-deep); border-radius: 28px; padding: 44px 48px 46px; color: #fff; }
  #s0-card .fila { display: flex; align-items: baseline; gap: 22px; }
  #s0-card .num { font-size: 190px; font-weight: 780; letter-spacing: -0.04em; line-height: .9; }
  #s0-card .veces { font-size: 44px; font-weight: 680; color: var(--primary-soft); letter-spacing: -0.015em; }
  #s0-card .det { font-size: 30px; color: rgb(255 255 255 / .65); margin-top: 4px; }
  #s0-card .dots { display: flex; gap: 12px; margin-top: 34px; }
  #s0-card .dots i { width: 56px; height: 14px; border-radius: 7px; background: #d8f5df; display: block; }
  #s0-foot { left: 96px; right: 96px; top: 1590px; display: flex; justify-content: space-between; font-size: 25px; font-weight: 600; color: var(--muted-fg); }
</style>

  fileText: '<path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  search: '<path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/>',
  crosshair: '<circle cx="12" cy="12" r="10"/><line x1="22" x2="18" y1="12" y2="12"/><line x1="6" x2="2" y1="12" y2="12"/><line x1="12" x2="12" y1="6" y2="2"/><line x1="12" x2="12" y1="22" y2="18"/>',
  map: '<path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/>',
  handshake: '<path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/>',
  vote: '<path d="m9 12 2 2 4-4"/><path d="M5 7c0-1.1.9-2 2-2h10a2 2 0 0 1 2 2v12H5V7Z"/><path d="M22 19H2"/>',
  mapPin: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  chartPie: '<path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z"/><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/>',
};

const DATA = window.DATA;

/* ───────────── Guion (segundos) ───────────── */
const T = { s1: 0, s2: 3.2, s3: 6.0, s4: 10.8, s5: 20.0, s6: 28.0, fin: 32.0 };
const CUENTA = { inicio: T.s3 + 0.4, paso: 0.09 };  // 11 marcas en ~1 s; luego se queda fijo
const PASO_CLAVES = 2.0;                           // segundos entre cada clave de «Qué dice»
const RETRASO_TRAMPA = 2.6;                         // segundos entre el Tribunal y la trampa
const PORTADA = 0.7;                               // segundos de portada al inicio
const DUR = T.fin + PORTADA;
const FPS = 30;

/* ───────────── Montaje del DOM ───────────── */
const $ = (s) => document.querySelector(s);
const eyebrow = `Los artículos que más caen · ${DATA.tema}`;
$("#s1-eyebrow").textContent = eyebrow;
$("#s1-q").innerHTML = DATA.pregunta
  .map((l) => `<span>${l.replace(/\[(.+?)\]/, '<span class="subrayado">$1<i></i></span>')}</span>`).join("");
$("#s1-sub").textContent = DATA.subtitulo;
$("#s2-eyebrow").textContent = eyebrow;
$("#s2-art").textContent = DATA.articulo;
$("#s2-ley").textContent = DATA.ley;
$("#s2-chip span").textContent = DATA.apodo;
$("#s3-dots").innerHTML = Array.from({ length: DATA.veces }, () => "<i></i>").join("");
$("#s3-years").textContent = DATA.anios;
$("#s4-facts").innerHTML = DATA.claves.map(([ic, k, v], i) =>
  `<div class="abs fact"><div class="tile"><svg viewBox="0 0 24 24">${ICONOS[ic]}</svg></div>` +
  `<div><div class="k">${k}</div><div class="v">${v}</div></div></div>`).join("");
$("#s0-eyebrow").textContent = eyebrow;
$("#s0-art").textContent = DATA.articulo;
$("#s0-ley").textContent = DATA.ley;
$("#s0-chip span").textContent = DATA.apodo;
$("#s0-card .num").textContent = DATA.veces;
$("#s0-card .veces").textContent = DATA.veces === 1 ? "vez" : "veces";
$("#s0-card .dots").innerHTML = Array.from({ length: DATA.veces }, () => "<i></i>").join("");
$("#s0-foot span").textContent = DATA.fuente;

/* Lo que depende de medir texto se hace con las fuentes ya cargadas */
let medido = false;
function medir() {
  // Cada clave se coloca debajo de la anterior según lo que ocupe su texto
  // Si no caben antes del pie, se reduce el texto hasta un 80 %
  const facts = [...document.querySelectorAll(".fact")];
  for (let k = 1; k >= 0.8; k -= 0.02) {
    let y = 930;
    facts.forEach((f) => { f.style.setProperty("--k", k); f.style.top = `${y}px`; y += f.offsetHeight + 28 * k; });
    if (y <= 1570) break;
  }
  // La trampa va justo debajo de la tarjeta del Tribunal
  const card = $("#s5-card");
  $("#s5-trap").style.top = `${card.offsetTop + card.offsetHeight + 36}px`;
  // La pregunta del gancho se reduce si alguna línea no cabe en 900 px
  const q = $("#s1-q");
  const ancho = Math.max(...[...q.children].map((l) => { l.style.display = "inline-block"; const w = l.offsetWidth; l.style.display = ""; return w; }));
  if (ancho > 900) q.style.fontSize = `${Math.floor(128 * 900 / ancho)}px`;
  // El artículo de la portada, lo más grande posible sin salirse (máx. 240 px)
  const art = $("#s0-art");
  art.style.fontSize = "240px";
  art.style.fontSize = `${Math.min(240, Math.floor(240 * 900 / art.scrollWidth))}px`;
  medido = true;
}
$("#s5-card .v").textContent = DATA.tribunal;
$("#s5-trap .v").innerHTML = DATA.trampa;
$("#foot span").textContent = DATA.fuente;

/* ───────────── Utilidades de animación ───────────── */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
// Aproximación de --ease-product: cubic-bezier(0.22, 1, 0.36, 1)
const ease = (x) => 1 - Math.pow(1 - x, 4);
const outBack = (x) => { const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

function set(el, { o = 1, x = 0, y = 0, s = 1 } = {}) {
  el.style.opacity = o;
  el.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  el.style.visibility = o <= 0.001 ? "hidden" : "visible";
}
/* Entrada tipo [data-reveal] de la web (sube y aparece) y salida en fundido */
function inOut(el, t, tin, tout, { dy = 36, dx = 0, dur = 0.6, outDur = 0.35 } = {}) {
  const a = ease(p(t, tin, tin + dur));
  const b = tout == null ? 0 : p(t, tout, tout + outDur);
  set(el, { o: a * (1 - b), y: (1 - a) * dy - b * 24, x: (1 - a) * dx });
}

/* ───────────── Render determinista ───────────── */
function escenas(t) {
  const fin56 = T.s6; // todo lo claro sale cuando entra el cierre

  // Cabecera y pie
  const hdr = ease(p(t, 0, 0.5));
  set($("#logo"), { o: hdr, y: (1 - hdr) * -16 });
  set($("#pill"), { o: hdr, s: 0.9 + 0.1 * hdr });
  set($("#foot"), { o: hdr });
  set($("#bar"), { o: hdr });
  $("#bar i").style.width = `${clamp(t / fin56) * 100}%`;

  // 1 · Gancho
  const s1out = T.s2 - 0.1;
  inOut($("#s1-eyebrow"), t, 0.2, s1out);
  [...$("#s1-q").children].forEach((l, i) => {
    const a = ease(p(t, 0.3 + i * 0.14, 0.95 + i * 0.14));
    const b = p(t, s1out - 0.05, s1out + 0.3);
    set(l, { o: a * (1 - b), y: (1 - a) * 60 - b * 60 });
  });
  const sub = $("#s1-q .subrayado i");
  if (sub) sub.style.transform = `scaleX(${ease(p(t, 1.2, 1.8))})`;
  inOut($("#s1-sub"), t, 1.4, s1out, { dy: 24 });

  // 2 · Revelación (el artículo se queda como titular hasta el cierre)
  {
    const out = p(t, fin56 - 0.3, fin56);
    const a = ease(p(t, T.s2, T.s2 + 0.8));
    set($("#s2-art"), { o: clamp(a * 1.5) * (1 - out), s: 1.12 - 0.12 * a });
    inOut($("#s2-eyebrow"), t, T.s2 + 0.2, fin56 - 0.3);
    inOut($("#s2-ley"), t, T.s2 + 0.5, fin56 - 0.3, { dy: 20 });
    const c = outBack(p(t, T.s2 + 0.9, T.s2 + 1.4));
    set($("#s2-chip"), { o: clamp(c) * (1 - out), s: 0.8 + 0.2 * c });
  }

  // 3 · Contador rápido y pausa larga en el total
  {
    inOut($("#s3-card"), t, T.s3, T.s4 - 0.35, { dy: 60 });
    const { inicio, paso } = CUENTA;
    const n = clamp(Math.floor((t - inicio) / paso) + 1, 0, DATA.veces);
    $("#s3-num").textContent = n;
    $("#s3-card .veces").textContent = n === 1 ? "vez" : "veces";
    [...$("#s3-dots").children].forEach((d, i) => {
      const a = ease(p(t, inicio + i * paso, inicio + i * paso + 0.2));
      d.style.transform = `scaleX(${a})`;
      d.style.opacity = a;
    });
    const fin = inicio + DATA.veces * paso;
    const y = ease(p(t, fin, fin + 0.5));
    set($("#s3-years"), { o: y, y: (1 - y) * 16 });
    // pequeño golpe al llegar al total
    const golpe = Math.sin(Math.PI * p(t, fin - 0.05, fin + 0.35));
    $("#s3-num").style.transform = `scale(${1 + 0.06 * golpe})`;
    $("#s3-num").style.transformOrigin = "0 80%";
  }

  // 4 · Qué dice (más pausado)
  {
    const out = T.s5 - 0.35;
    inOut($("#s4-eyebrow"), t, T.s4, out);
    [...document.querySelectorAll(".fact")].forEach((f, i) => {
      inOut(f, t, T.s4 + 0.4 + i * PASO_CLAVES, out, { dy: 0, dx: -50, dur: 0.7 });
    });
  }

  // 5 · Tribunal + trampa (más pausado)
  inOut($("#s5-card"), t, T.s5, fin56 - 0.3, { dy: 60, dur: 0.7 });
  {
    const tin = T.s5 + RETRASO_TRAMPA;
    const a = outBack(p(t, tin, tin + 0.6));
    const b = p(t, fin56 - 0.3, fin56);
    set($("#s5-trap"), { o: clamp(a) * (1 - b), s: 0.9 + 0.1 * a, y: (1 - clamp(a)) * 30 });
  }

  // 6 · Cierre
  {
    const a = ease(p(t, T.s6, T.s6 + 0.7));
    const s6 = $("#s6");
    s6.style.visibility = a > 0 ? "visible" : "hidden";
    s6.style.clipPath = `inset(${(1 - a) * 100}% 0 0 0)`;
    const iso = outBack(p(t, T.s6 + 0.4, T.s6 + 0.9));
    set($("#s6-iso"), { o: clamp(iso), s: 0.7 + 0.3 * iso });
    inOut($("#s6-t"), t, T.s6 + 0.6, null);
    inOut($("#s6-p"), t, T.s6 + 0.85, null, { dy: 24 });
    const btn = outBack(p(t, T.s6 + 1.1, T.s6 + 1.6));
    set($("#s6-btn"), { o: clamp(btn), s: 0.85 + 0.15 * btn });
    inOut($("#s6-handle"), t, T.s6 + 1.4, null, { dy: 16 });
  }
}
/* Portada fija en el primer fotograma; se funde mientras entra el gancho */
function render(t) {
  if (!medido && document.fonts.status === "loaded") medir();
  escenas(Math.max(0, t - PORTADA));
  const o = 1 - ease(p(t, PORTADA - 0.2, PORTADA + 0.2));
  const s0 = $("#s0");
  s0.style.opacity = o;
  s0.style.visibility = o <= 0.001 ? "hidden" : "visible";
}
window.render = render;
window.VIDEO = { DUR, FPS, T };

/* ───────────── Reproducción en navegador ───────────── */
if (!/[?&]render\b/.test(location.search)) {
  const fit = () => {
    const k = Math.min(innerWidth / 1080, innerHeight / 1920);
    $("#stage").style.transform = `scale(${k})`;
  };
  addEventListener("resize", fit); fit();
  document.fonts.ready.then(() => {
    const start = performance.now();
    const loop = (now) => { render(((now - start) / 1000) % (DUR + 1)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
} else {
  document.body.classList.add("render");
  render(0);
}
</script>
</body>
</html>
